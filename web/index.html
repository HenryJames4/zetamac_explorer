<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zetamac Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">

  Zetamac data explorer. Data in data/*.js is built by pipeline/site_data.py.
-->

<script>window.ZDATA = {};</script>

<style>
  :root {
    --ink: #16181D; --ink-2: #3F4652; --muted: #4A505C;
    --line: #E2E4E8; --line-2: #ECEDF0; --soft: #F3F4F6; --bg: #F6F6F3;
    --accent: #2457D6; --key: #2E7031; --err: #A33A35; --think: #C9CDD4;
    --you: #0E9488; --you-ink: #0B6F66;
    --surface: #fff; --surface-2: #FAFAF8; --stage: #F1F2F4; --tabs: #EEEFF2; --border: #D5D7DC;
    --accent-soft: rgba(36,87,214,.09); --accent-soft-2: rgba(36,87,214,.15);
    --wrong-ink: #B42318; --wrong-bg: #FDE7E5;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --ink: #E8EAEE; --ink-2: #B4BAC6; --muted: #8C93A1;
    --line: #262C38; --line-2: #20252F; --soft: #1C212C; --bg: #0B0D11;
    --accent: #7AA2FF; --key: #2E9F55; --err: #E0574F; --think: #3A4150;
    --you: #2DD4BF; --you-ink: #5EEAD4;
    --surface: #141820; --surface-2: #181C25; --stage: #1C212C; --tabs: #1C212C; --border: #2E3543;
    --accent-soft: rgba(122,162,255,.12); --accent-soft-2: rgba(122,162,255,.2);
    --wrong-ink: #FF8A80; --wrong-bg: rgba(242,100,92,.16);
  }
  [data-theme="dark"] .box { box-shadow: none; }
  [data-theme="dark"] .tab.on { background: #2A303D; }   /* selected tab lighter than the track in dark mode */
  [data-theme="dark"] .logo.light, [data-theme="light"] .logo.dark, .theme .sun, [data-theme="dark"] .theme .moon { display: none; }
  [data-theme="dark"] .theme .sun { display: inline; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Instrument Sans', system-ui, sans-serif; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .page { max-width: 1000px; margin: 0 auto; padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 16px; }

  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; }
  h1 .logo { height: 1em; width: 1em; flex: none; }
  .titles { display: flex; flex-direction: column; gap: 4px; }
  h1 { display: flex; align-items: center; gap: 10px; margin: 0; font-family: var(--mono); font-size: 36px; line-height: 1; letter-spacing: -0.03em; word-spacing: -0.25em; }
  .sub { margin: 0; font-size: 15px; line-height: 1.4; color: var(--ink-2); max-width: 380px; }
  nav { display: flex; flex-wrap: wrap; gap: 4px 20px; }
  .link { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0; border: 0; background: none;
          color: var(--ink-2); font-size: 14px; font-weight: 500; text-decoration: none; cursor: pointer; }
  .link:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .link.play { color: var(--accent); font-weight: 600; padding: 0 12px; border-radius: 8px; background: var(--accent-soft); }
  .link.play:hover { background: var(--accent-soft-2); text-decoration: none; }
  .cite { margin: 4px 0 0; text-align: left; font-family: var(--mono); font-size: 13px; line-height: 1.6; background: var(--surface);
          border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; color: var(--ink-2); white-space: pre-wrap;
          width: 100%; }
  .cite[hidden] { display: none; }

  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
         box-shadow: 0 1px 2px rgba(22,24,29,.05), 0 12px 32px rgba(22,24,29,.06); }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
             padding: 10px 16px; border-bottom: 1px solid var(--line-2); background: var(--surface-2); }
  .tabs { display: flex; gap: 4px; background: var(--tabs); padding: 4px; border-radius: 12px; }
  .tab { height: 40px; padding: 0 16px; border-radius: 9px; border: 0; background: transparent; color: var(--muted);
         font-size: 14px; font-weight: 600; cursor: pointer; }
  .tab.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(22,24,29,.12); }
  .ctrls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chip { height: 40px; min-width: 44px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface);
          font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .chip.op { font-family: var(--mono); font-size: 18px; padding: 0; width: 44px; }
  .label { font-size: 13px; color: var(--muted); margin-right: 4px; }
  .body { padding: 16px 24px 20px; display: flex; flex-direction: column; gap: 14px; }

  /* Live session */
  .game { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .game-bar { display: flex; justify-content: space-between; padding: 10px 16px; font-size: 14px; color: var(--ink-2);
              background: var(--surface-2); border-bottom: 1px solid var(--line-2); }
  .game-bar b { font-family: var(--mono); color: var(--ink); }
  .stage { height: 92px; display: flex; align-items: center; justify-content: center; background: var(--stage);
           font-family: var(--mono); font-size: 34px; font-weight: 600; }
  .stage .prob { display: flex; align-items: center; gap: 14px; }
  .input { display: inline-flex; align-items: center; min-width: 110px; height: 52px; padding: 0 12px; border-radius: 6px;
           background: var(--surface); border: 2px solid var(--accent); }
  .ch { padding: 0 1px; border-radius: 3px; }
  .ch.wrong { color: var(--wrong-ink); background: var(--wrong-bg); }
  .caret { display: inline-block; width: 2px; height: 30px; margin-left: 2px; background: var(--ink); }
  .over { font-size: 26px; }
  .rec { display: flex; flex-direction: column; gap: 10px; }
  .rec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .chart { display: flex; gap: 6px; }
  .yaxis { position: relative; flex: 0 0 52px; height: 270px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .yaxis .t { position: absolute; right: 0; }
  .yaxis .title { position: absolute; left: 0; writing-mode: vertical-rl; transform: translateY(50%) rotate(180deg);
                  font-family: 'Instrument Sans', sans-serif; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .plot { position: relative; flex: 1 1 auto; min-width: 0; height: 270px; overflow: hidden; }
  .grid { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); }
  .grid.base { border-top: 2px solid var(--ink); }
  .bars { position: relative; display: flex; align-items: flex-end; justify-content: flex-end; gap: 8px; height: 270px; }
  .bar { flex: 0 0 52px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px;
         background: transparent; border: 0; border-radius: 8px; padding: 2px 0 6px; cursor: pointer; font-family: var(--mono); }
  .bar:hover .stack { filter: brightness(1.1); }
  .bar .top { font-size: 12px; font-weight: 700; }
  .stack { display: flex; flex-direction: column-reverse; width: 42px; border-radius: 5px 5px 0 0; overflow: hidden; }
  .seg { color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
         border-top: 1px solid rgba(255,255,255,.45); overflow: hidden; }
  .plab { height: 42px; white-space: pre-line; font-size: 11px; line-height: 1.2; text-align: center; color: var(--muted); }
  .note { margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted); }

  /* By problem */
  .p-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .p-title { font-family: var(--mono); font-size: 44px; font-weight: 700; line-height: 1; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; min-width: min(100%, 420px); }
  .stat { background: var(--soft); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .stat b { font-family: var(--mono); font-size: 22px; }
  .p-cols { display: flex; flex-wrap: wrap; gap: 24px; }
  .p-col { flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .h3 { font-size: 14px; font-weight: 600; }
  .hist { position: relative; height: 220px; display: flex; align-items: flex-end; gap: 2px; border-bottom: 2px solid var(--ink); }
  .hbar { flex: 1 1 0; min-width: 0; border-radius: 2px 2px 0 0; }
  .vline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--ink); }
  .vlab { position: absolute; top: 4px; font-size: 12px; font-weight: 600; padding-left: 6px; }
  .you { position: absolute; top: 24px; bottom: 0; width: 3px; margin-left: -1px; background: var(--you); }
  .youlab { position: absolute; top: 24px; font-size: 12px; font-weight: 700; color: var(--you-ink); padding-left: 6px; }
  .xaxis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .heatwrap { display: flex; gap: 8px; }
  .rowlab { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; color: var(--muted); text-align: center; }
  .heat { flex: 1 1 auto; min-width: 0; display: grid; gap: 1px; background: var(--surface); }
  .cell { border: 0; padding: 0; cursor: pointer; position: relative; }
  .cell.hit { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--you); z-index: 2; }
  .collab { font-size: 12px; color: var(--muted); text-align: center; }
  .scale { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .scale i { flex: 1 1 auto; height: 10px; border-radius: 999px;
             background: linear-gradient(90deg, #F9D057, #F28C38, #D6456A, #8E2C8C, #3B1C6E); }
  .hint { font-size: 13px; color: var(--muted); }
  .scale-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .grid-row { display: flex; gap: 8px; width: 100%; max-width: 860px; }
  #grid, #gridgl { flex: 1; min-width: 0; aspect-ratio: 2 / 1; display: block; }
  .speed { display: flex; align-items: center; gap: 8px; writing-mode: vertical-rl; transform: rotate(180deg);
           font-size: 11px; font-weight: 600; color: var(--muted); }
  .speed i { flex: 1; width: 1px; background: linear-gradient(var(--line), var(--muted)); }
  .answers { width: 100%; max-width: 860px; text-align: right; font-family: var(--mono); font-size: 13px; color: var(--ink-2); }
  .answers b { display: inline-block; min-width: 11ch; color: var(--ink); font-variant-numeric: tabular-nums; }
  .slider { width: 200px; accent-color: var(--ink); }
  @media (max-width: 560px) {
    h1 { font-size: 28px; }
    .page { padding: 16px 12px 24px; gap: 12px; }
    nav { gap: 2px 14px; }
    .toolbar { padding: 8px 10px; gap: 8px; }
    .tabs { width: 100%; }
    .tab { flex: 1 1 0; height: 36px; padding: 0 6px; font-size: 13px; white-space: nowrap; }
    .chip { height: 36px; padding: 0 10px; font-size: 13px; }
    .chip.op { width: 40px; }
    .body { padding: 12px; gap: 12px; }
    .game-bar { padding: 8px 12px; font-size: 13px; }
    .stage { height: 76px; font-size: 24px; }
    .stage .prob { gap: 8px; white-space: nowrap; }
    .input { min-width: 72px; height: 42px; padding: 0 8px; }
    .caret { height: 22px; }
    .over { font-size: 18px; }
    .legend { gap: 10px; font-size: 12px; }
    .yaxis { flex-basis: 46px; }
    .bars { gap: 4px; }
    .bar { flex-basis: 38px; }
    .stack { width: 30px; }
    .p-title { font-size: 30px; }
    .stat b { font-size: 18px; }
  }
  footer { display: flex; justify-content: center; }
  .badge { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: #FDF0D5; color: #7A4E00; }
</style>
</head>

        <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <a class="link play" href="https://arithmetic.zetamac.com/" target="_blank" rel="noopener">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>Play Zetamac</a>
    </nav>
    <pre class="cite" id="cite" hidden>@article{zetamac2026,
  title   = {[PAPER TITLE]},
  author  = {Arthur, Henry and [CO-AUTHORS]},

  year    = {[YEAR]}

  <section class="box" aria-label="Interactive data explorer">
    <div class="toolbar" id="toolbar"></div>
    <div class="body" id="body"></div>
  </section>

</div>

<script>
/* ============================== STATE ============================== */
const S = { t: 0, paused: false, session: 0, mode: 'live', prob: null };
const GAME_MS = 120000, CYCLE = 124000;
const BINS = 32, HIST_MAX = 8000, BIN_W = HIST_MAX / BINS;

/* ============================== HELPERS ============================== */
const fmt = (ms) => (ms / 1000).toFixed(2) + ' s';
/* RT -> colour on a log scale between an operator's fastest and slowest heatmap cell. */
const rtColor = (ms, hm) => color(Math.log(ms / hm.lo) / Math.log(hm.hi / hm.lo));
function color(x) {
  const stops = [[249,208,87],[242,140,56],[214,69,106],[142,44,140],[59,28,110]];   // fast (yellow) to slow (indigo)
  const v = Math.max(0, Math.min(0.9999, x)) * (stops.length - 1);
  const i = Math.floor(v), f = v - i, a = stops[i], b = stops[i + 1];
  return 'rgb(' + a.map((q, j) => Math.round(q + (b[j] - q) * f)).join(',') + ')';
}

/* Problem coordinates: every problem is (op, r, c) on its operator's grid. */
const OPS = {
  add: { sym: '+', name: 'addition',       rows: [2, 100], cols: [2, 100], rowLabel: 'First operand', colLabel: 'Second operand (2 → 100)', k: 1 },
  sub: { sym: '−', name: 'subtraction',    rows: [2, 100], cols: [2, 100], rowLabel: 'Subtrahend',    colLabel: 'Difference (2 → 100)',     k: 2 },
  mul: { sym: '×', name: 'multiplication', rows: [2, 12],  cols: [2, 100], rowLabel: 'Small factor',  colLabel: 'Large factor (2 → 100)',   k: 3 },
  div: { sym: '÷', name: 'division',       rows: [2, 12],  cols: [2, 100], rowLabel: 'Divisor',       colLabel: 'Quotient (2 → 100)',       k: 4 }
};
function probOf(op, r, c) {
  if (op === 'add') return { text: r + ' + ' + c, ans: r + c, top: r, bot: c };
  if (op === 'sub') return { text: (r + c) + ' − ' + r, ans: c, top: r + c, bot: r };
  if (op === 'mul') return { text: r + ' × ' + c, ans: r * c, top: r, bot: c };
  return { text: (r * c) + ' ÷ ' + r, ans: c, top: r * c, bot: r };
}

/* ============================== DATA ==============================
   ZDATA[op].cells[(r - r0) * nCols + (c - c0)] = [median ms, n, first-try %, hist]
   hist = trial counts in 250 ms bins over 0-8 s, then one overflow bin (> 8 s).
   ZDATA.sessions = [{ label, score, trials: [[op, R, C, rt | null, keys]] }],
   keys one char per press ('<' = backspace); rt null = unfinished at time-out.
   =================================================================== */
const OP_KEYS = ['add', 'sub', 'mul', 'div'];
function cell(op, r, c) {
  const d = ZDATA[op], nCols = d.cols[1] - d.cols[0] + 1;
  return d.cells[(r - d.rows[0]) * nCols + (c - d.cols[0])];
}
function meanRt(op, r, c) {
  const x = cell(op, r, c);
  return x ? x[0] : null;
}
function problemStats(op, r, c) {
  const [med, n, firstTry, hist] = cell(op, r, c);
  return { med, n, firstTry, hist };
}
/* Share of this problem's trials slower than ms, linear within the 250 ms bin. */
function slowerShare(hist, n, ms) {
  const b = Math.min(BINS, Math.floor(ms / BIN_W));
  let above = 0;
  for (let i = b + 1; i <= BINS; i++) above += hist[i];
  const inBin = b < BINS ? 1 - (ms - b * BIN_W) / BIN_W : 0.5;   // overflow bin has no width: count half
  return (above + hist[b] * inBin) / n;
}
let _sessions = null;
function sessions() {
  return _sessions || (_sessions = ZDATA.sessions.map((s) => {
    let t = 0;
    const trials = s.trials.map(([o, R, C, rt, ks]) => {
      const op = OP_KEYS[o], pr = probOf(op, R, C), ans = String(pr.ans);
      let buf = '';
      const keys = [...ks].map((ch) => {
        if (ch === '<') { buf = buf.slice(0, -1); return { back: true }; }
        buf += ch;
        return { d: ch, wrong: !ans.startsWith(buf) };
      });
      const tr = withTiming({ start: t, rt: rt == null ? GAME_MS - t + 1 : rt, op, R, C, pr, keys });
      t += tr.rt;
      return tr;
    });
    const slowest = Math.max(...s.trials.filter((x) => x[3] != null).map((x) => x[3]));
    return { label: s.label, score: s.score, trials, slowest };
  }));
}

/* Keystrokes are spread evenly across the trial's RT (the data has trial RTs,
   not per-key timestamps), matching Fig. C in the paper. */
function withTiming(tr) {
  tr.end = tr.start + tr.rt;
  tr.seg = tr.rt / Math.max(1, tr.keys.length);
  tr.keys.forEach((k, i) => { k.t = tr.start + (i + 1) * tr.seg; });
  return tr;
}

/* ============================== LIVE VIEW ============================== */
const STACK_H = 190, BASE = 52;          // px geometry of the recording chart
let liveBars = [];

function renderLive(now) {
  const sess = sessions()[S.session];
  const gt = S.t % CYCLE, over = gt >= GAME_MS, tt = Math.min(gt, GAME_MS);
  const done = sess.trials.filter((x) => x.end <= tt);
  const cur = over ? null : sess.trials.find((x) => x.start <= tt && x.end > tt);
  const chars = [];
  if (cur) cur.keys.forEach((k) => { if (k.t > tt) return; if (k.back) chars.pop(); else chars.push(k); });
  // Y-axis top: the session's slowest completed trial, rounded up to the tick step.
  const step = sess.slowest > 6000 ? 2000 : 1000, MAXRT = Math.ceil(sess.slowest / step) * step;
  const px = (ms) => Math.max(0, Math.min(STACK_H, (ms / MAXRT) * STACK_H));

  liveBars = done.slice(-13).map((x) => ({ x, partial: false }));
  if (cur) liveBars.push({ x: cur, partial: true });
  const barsHTML = liveBars.map(({ x, partial }, i) => {
    const segs = partial && !x.keys.length
      ? `<div class="seg" style="height:${px(tt - x.start).toFixed(1)}px;background:var(--think)"></div>`
      : x.keys.map((k, j) => {
      const s0 = x.start + j * x.seg;
      if (!partial || k.t <= tt) {
        const c = k.wrong || k.back ? 'var(--err)' : 'var(--key)';
        const label = x.seg > 700 ? (k.back ? '⌫' : k.d) : '';
        return `<div class="seg" style="height:${px(x.seg).toFixed(1)}px;background:${c}">${label}</div>`;
      }
      if (s0 <= tt) return `<div class="seg" style="height:${px(tt - s0).toFixed(1)}px;background:var(--think)"></div>`;
      return '';
    }).join('');
    const aria = `${x.pr.text}, ${partial ? 'in progress' : fmt(x.rt)}. Show this problem.`;
    return `<button class="bar" data-act="bar" data-i="${i}" aria-label="${aria}">
      <span class="top">${partial ? '…' : x.pr.ans}</span>
      <div class="stack">${segs}</div>
      <span class="plab">${x.pr.top}\n${OPS[x.op].sym}\n${x.pr.bot}</span></button>`;
  }).join('');

  const ticks = [];
  for (let v = 0; v <= MAXRT; v += step) ticks.push(v);
  const caretOn = S.paused || Math.floor(now / 500) % 2 === 0;
  document.getElementById('body').innerHTML = `
    <div class="game">
      <div class="game-bar"><span>Seconds left: <b>${Math.max(0, Math.ceil((GAME_MS - tt) / 1000))}</b></span><span>Score: <b>${done.length}</b></span></div>
      <div class="stage">${over || !cur ? `<span class="over">Time's up · Score ${done.length}</span>` : `
        <div class="prob"><span>${cur.pr.text} =</span><span class="input">${chars.map((c) =>
          `<span class="ch${c.wrong ? ' wrong' : ''}">${c.d}</span>`).join('')}<span class="caret" style="opacity:${caretOn ? 1 : 0}"></span></span></div>`}
      </div>
    </div>
    <div class="rec">
      <div class="rec-head">
        <span class="eyebrow">Recording</span>
        <div class="legend">
          <span><i class="sw" style="background:var(--key)"></i>Keystroke</span>
          <span><i class="sw" style="background:var(--err)"></i>Wrong digit or backspace</span>        </div>
      </div>
      <div class="chart">
        <div class="yaxis"><span class="title" style="bottom:${BASE + STACK_H / 2}px">RT (ms)</span>${ticks.map((v) =>
          `<span class="t" style="bottom:${BASE - 7 + (v / MAXRT) * STACK_H}px">${v}</span>`).join('')}</div>
        <div class="plot">
          ${ticks.slice(1).map((v) => `<span class="grid" style="bottom:${BASE + (v / MAXRT) * STACK_H}px"></span>`).join('')}
          <span class="grid base" style="bottom:${BASE - 1}px"></span>
          <div class="bars">${barsHTML}</div>
        </div>
      </div>
    </div>`;
}

/* ============================== PROBLEM VIEW ============================== */
const heatCache = {};
function heatFor(op) {
  if (heatCache[op]) return heatCache[op];
  const info = OPS[op];
  const rStep = op === 'add' || op === 'sub' ? 3 : 1, cStep = 3;
  const rows = [], cols = [];
  for (let v = info.rows[0]; v <= info.rows[1]; v += rStep) rows.push(v);
  for (let v = info.cols[0]; v <= info.cols[1]; v += cStep) cols.push(v);
  const vals = [];
  let lo = Infinity, hi = -Infinity;
  rows.forEach((r0) => cols.forEach((c0) => {
    let s = 0, n = 0;
    for (let r = r0; r < r0 + rStep && r <= info.rows[1]; r++)
      for (let c = c0; c < c0 + cStep && c <= info.cols[1]; c++) {
        const x = meanRt(op, r, c);
        if (x != null) { s += x; n++; }
      }
    const m = s / n;   // cell colour = unweighted mean of the block's per-problem medians
    lo = Math.min(lo, m); hi = Math.max(hi, m);
    vals.push({ r0, c0, m, rc: Math.min(r0 + Math.floor(rStep / 2), info.rows[1]), cc: Math.min(c0 + 1, info.cols[1]) });
  }));
  return (heatCache[op] = { cols, vals, lo, hi, rStep, cStep });
}

let cur = null;   // current problem stats
function setProblem(op, r, c, userRt) {
  S.prob = { op, r, c, userRt };
  cur = { ...problemStats(op, r, c), pr: probOf(op, r, c) };
}

function renderProblem() {
  const pb = S.prob, info = OPS[pb.op], hm = heatFor(pb.op);
  const hasUser = pb.userRt != null;
  const cells = hm.vals.map((v, i) => {
    const hit = pb.r >= v.r0 && pb.r < v.r0 + hm.rStep && pb.c >= v.c0 && pb.c < v.c0 + hm.cStep;
    const q = probOf(pb.op, v.rc, v.cc);
    return `<button class="cell${hit ? ' hit' : ''}" data-act="cell" data-i="${i}" aria-label="${q.text}, median ${fmt(meanRt(pb.op, v.rc, v.cc))}"
      style="height:${pb.op === 'mul' || pb.op === 'div' ? 18 : 7}px;background:${rtColor(v.m, hm)}"></button>`;
  }).join('');

  document.getElementById('body').innerHTML = `
    <div class="p-head">
      <div style="display:flex;flex-direction:column;gap:6px">
        <span class="eyebrow">Problem</span>
        <span class="p-title">${cur.pr.text} = ${cur.pr.ans}</span>
      </div>
      <div class="stats">
        <div class="stat"><span>Times answered</span><b>${cur.n.toLocaleString('en-US')}</b></div>
        <div class="stat"><span>Median RT</span><b>${fmt(cur.med)}</b></div>
        <div class="stat"><span>First-try correct</span><b>${cur.firstTry}%</b></div>
      </div>
    </div>
    <div class="p-cols">
      <div class="p-col">
        <div class="row">
          <span class="h3">Response times for this problem</span>
        </div>
        <div class="hist" id="hist"></div>
        <div class="xaxis"><span>0 s</span><span>2 s</span><span>4 s</span><span>6 s</span><span>8 s</span></div>
        ${hasUser ? `<span style="font-size:14px;color:var(--ink-2)">This player took <strong style="color:var(--you-ink)">${fmt(pb.userRt)}</strong>, faster than ${Math.round(slowerShare(cur.hist, cur.n, pb.userRt) * 100)}% of attempts.</span>` : ''}
      </div>
      <div class="p-col" style="flex-basis:340px">
        <span class="h3">Every ${info.name} problem, by median RT</span>
        <div class="heatwrap">
          <span class="rowlab">${info.rowLabel}</span>
          <div class="heat" style="grid-template-columns:repeat(${hm.cols.length},minmax(0,1fr))">${cells}</div>
        </div>
        <span class="collab">${info.colLabel}</span>
        <div class="scale"><span>fast · ${fmt(hm.lo)}</span><i></i><span>${fmt(hm.hi)} · slow</span></div>
        <span class="hint">Select any cell to jump to that problem.</span>
      </div>
    </div>`;
  renderHist();
}

/* Full RT histogram over 0-8 s; trials over 8 s are not drawn. */
function renderHist() {
  const hist = document.getElementById('hist'), pb = S.prob;
  const bins = cur.hist.slice(0, BINS), maxF = Math.max(...bins), hm = heatFor(pb.op);
  const medX = Math.min(99, (cur.med / HIST_MAX) * 100);
  const userX = pb.userRt != null ? Math.min(99, (pb.userRt / HIST_MAX) * 100) : null;
  hist.innerHTML =
    bins.map((x, b) => `<span class="hbar" style="height:${(x / maxF * 92).toFixed(1)}%;background:${rtColor((b + 0.5) * BIN_W, hm)}"></span>`).join('') +
    `<span class="vline" style="left:${medX}%"></span><span class="vlab" style="left:${medX}%">median</span>` +
    (userX != null ? `<span class="you" style="left:${userX}%"></span><span class="youlab" style="left:${userX}%">this player</span>` : '');
}

/* ============================== ALL GAMES VIEW ============================== */
const R_MIN = 7, CROWD_R = 50;   // grid is 2r x r games; above CROWD_R rows it is drawn on the GPU
const FADE = 600, SLOT = 100;    // flash fade (ms); keystroke timeline slot on the GPU (ms)
const PAL = {   // canvas colours per theme: idle square, --key and --err, text
  light: { idle: [228, 230, 234], vivid: [null, [46, 112, 49], [163, 58, 53]], text: '#16181D' },
  dark: { idle: [30, 35, 48], vivid: [null, [46, 159, 85], [224, 87, 79]], text: '#E8EAEE' },
};
const pal = () => PAL[document.documentElement.dataset.theme] || PAL.light;
let SC = null;
function answerOf(p) {
  const [, a, op, b] = p.match(/(\d+)([-+*/])(\d+)/), x = +a, y = +b;
  return String(op === '+' ? x + y : op === '-' ? x - y : op === '*' ? x * y : x / y);
}
function buildScale() {
  const games = ZDATA.scale.games.map((g) => {
    let t = 0, keyS = '';
    const keyT = [], keyC = [], ansT = [];
    const trials = g.split(',').map((str) => {
      const [rt, prob, keys] = str.split(':'), n = rt * 100, tr = { s: t, n, prob, keys, ans: answerOf(prob), at: [] };
      let buf = '';
      // Keystrokes spread evenly across the trial, as in the live view.
      [...keys].forEach((ch, j) => {
        buf = ch === '<' ? buf.slice(0, -1) : buf + ch;
        const at = t + (j + 1) * n / keys.length;
        tr.at.push(at); keyT.push(at); keyC.push(ch !== '<' && tr.ans.startsWith(buf) ? 1 : 2);
      });
      keyS += keys;
      ansT.push(t + n);
      t += n;
      return tr;
    });
    return { trials, len: t, keyT: Float64Array.from(keyT), keyC: Uint8Array.from(keyC), keyS, ansT, speed: ansT.length / t };
  });
  // Keystroke timeline for the GPU: per 100 ms slot, 1 + ms offset of the latest keystroke, +128 if wrong (0 = none).
  const slotOff = new Uint32Array(games.length);
  let total = 0;
  games.forEach((g, i) => { slotOff[i] = total; total += Math.ceil(g.len / SLOT); });
  const slots = new Uint8Array(Math.ceil(total / 4096) * 4096);
  games.forEach((g, i) => g.keyT.forEach((t, j) => {
    t %= g.len;
    const k = slotOff[i] + Math.floor(t / SLOT), v = Math.floor(t % SLOT) + 1;
    if (v >= (slots[k] & 127)) slots[k] = v | (g.keyC[j] === 2 ? 128 : 0);
  }));
  const rate = new Float64Array(games.length + 1);   // cumulative answers per ms
  games.forEach((g, i) => { rate[i + 1] = rate[i] + g.ansT.length / g.len; });
  // Speed = answers per ms, so games of different lengths and settings compare fairly.
  const rank = games.map((g, i) => i).sort((a, b) => games[b].speed - games[a].speed);
  SC = { games, slotOff, slots, rate, rank, pool: games.length, rMax: Math.floor(Math.sqrt(ZDATA.scale.total / 2)), t: 0, answers: 0 };
  if (!S.r) S.r = R_MIN;
}
function loadScale() {
  if (SC || document.getElementById('scaleData')) return;
  const s = document.createElement('script');
  s.id = 'scaleData'; s.src = 'data/scale.js?v=2';   // bump when scale.js is regenerated
  s.onload = () => { buildScale(); renderAll(); };
  document.head.appendChild(s);
}
const mix = (i, k) => { let h = Math.imul(i ^ k, 2654435761); h ^= h >>> 15; return Math.imul(h, 2246822519) >>> 0; };
const rFromSlider = (v) => Math.round(R_MIN * Math.pow(SC.rMax / R_MIN, v / 1000));
const sliderFromR = (r) => Math.round(1000 * Math.log(r / R_MIN) / Math.log(SC.rMax / R_MIN));
function scaleNote() {
  const n = 2 * S.r * S.r, shown = Number(n.toPrecision(n < 1000 ? 1 : 2));   // rounded for display
  return `<b>${shown.toLocaleString('en-US')}</b> games`;
}
function renderScale() {
  document.getElementById('body').innerHTML = SC ? `
    <div class="scale-wrap">
      <div class="grid-row">
        <div class="speed" aria-hidden="true"><span>Slower</span><i></i><span>Faster</span></div>
        <canvas id="grid"></canvas><canvas id="gridgl"></canvas>
      </div>
      <div class="answers">Answers: <b id="answers">0</b></div>
    </div>` : '<span class="hint">Loading games…</span>';
}
function drawScale(dt) {
  if (!SC || !document.getElementById('grid')) return;
  SC.t += dt;
  const n = 2 * S.r * S.r, crowd = S.r > CROWD_R;
  SC.answers += dt * (n <= SC.pool ? SC.rate[n] : n * SC.rate[SC.pool] / SC.pool);
  document.getElementById('answers').textContent = Math.round(SC.answers).toLocaleString('en-US');
  document.getElementById('grid').style.display = crowd ? 'none' : 'block';
  document.getElementById('gridgl').style.display = crowd ? 'block' : 'none';
  if (crowd) drawCrowd(); else drawSquares();
}

/* Up to CROWD_R rows: one square per game, sorted fastest to slowest, flashing on every keystroke. */
function orderFor(n) {
  if (SC.order?.length !== n) SC.order = Array.from({ length: n }, (_, i) => i).sort((a, b) => SC.games[b].speed - SC.games[a].speed);
  return SC.order;
}
function drawSquares() {
  const cv = document.getElementById('grid'), W = Math.round(cv.clientWidth * devicePixelRatio), H = Math.round(W / 2);
  if (cv.width !== W) { cv.width = W; cv.height = H; }
  const ctx = cv.getContext('2d'), cols = 2 * S.r, cell = W / cols, gap = cell > 6 ? Math.max(1, cell * 0.1) : 0;
  ctx.clearRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const order = orderFor(cols * S.r), { idle, vivid } = pal();
  for (let i = 0; i < cols * S.r; i++) {
    const g = SC.games[order[i]], lt = (SC.t + mix(i, 2)) % g.len;   // each square has its own start offset
    let lo = 0, hi = g.keyT.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (g.keyT[m] <= lt) lo = m + 1; else hi = m; }
    const j = lo > 0 ? lo - 1 : g.keyT.length - 1, age = lo > 0 ? lt - g.keyT[j] : lt + g.len - g.keyT[j];
    const f = age < FADE ? (1 - age / FADE) ** 1.5 : 0, c = vivid[g.keyC[j]];
    ctx.fillStyle = `rgb(${idle.map((x, k) => Math.round(x + (c[k] - x) * f))})`;
    const x = (i % cols) * cell, y = Math.floor(i / cols) * cell;
    ctx.fillRect(x + gap / 2, y + gap / 2, cell - gap, cell - gap);
    if (cell / devicePixelRatio >= 13) cellText(ctx, g, lt, x, y, cell, j, age, f);
  }
}
function cellText(ctx, g, lt, x, y, cell, j, age, f) {
  ctx.fillStyle = f > 0.5 ? '#fff' : pal().text;   // white text on a fresh flash
  if (cell / devicePixelRatio >= 44) {            // big cells: problem and the input so far
    const tr = g.trials.find((t) => lt >= t.s && lt < t.s + t.n);
    if (!tr) return;
    let buf = '';
    tr.at.forEach((at, k) => { if (at <= lt) buf = tr.keys[k] === '<' ? buf.slice(0, -1) : buf + tr.keys[k]; });
    ctx.font = `600 ${Math.round(cell * 0.17)}px 'JetBrains Mono', monospace`;
    ctx.fillText(tr.prob.replace('*', '×').replace('/', '÷').replace('-', '−'), x + cell / 2, y + cell * 0.36);
    ctx.font = `700 ${Math.round(cell * 0.22)}px 'JetBrains Mono', monospace`;
    ctx.fillText(buf, x + cell / 2, y + cell * 0.68);
  } else if (age < FADE) {                        // small cells: the digit just typed, fading with its flash
    ctx.globalAlpha = 1 - age / FADE;
    ctx.font = `700 ${Math.round(cell * 0.6)}px 'JetBrains Mono', monospace`;
    ctx.fillText(g.keyS[j] === '<' ? '⌫' : g.keyS[j], x + cell / 2, y + cell * 0.55);
    ctx.globalAlpha = 1;
  }
}

/* Above CROWD_R rows, on the GPU: each row draws its games from the matching slice of the speed-ranked pool. */
const CROWD_FS = `#version 300 es
precision highp float; precision highp int; precision highp usampler2D;
uniform usampler2D uSlots, uGames;
uniform uint uT, uPool;
uniform float uTf;
uniform int uRows, uCols;
uniform vec2 uRes;
uniform vec3 uIdle, uOk, uErr;
out vec4 color;
uint mix32(uint i, uint k) { uint h = (i ^ k) * 2654435761u; h ^= h >> 15; return h * 2246822519u; }
vec2 age(uint i) {   // ms since the last keystroke, and 1 if it was wrong
  float q = (float(i / uint(uCols)) + float(mix32(i, 1u) >> 8) / 16777216.0) / float(uRows);
  uint p = min(uint(q * float(uPool)), uPool - 1u);   // rank in the pool, fastest first
  uvec2 g = texelFetch(uGames, ivec2(int(p % 128u), int(p / 128u)), 0).rg;   // slot offset, length (ms)
  uint lt = (uT % g.y + mix32(i, 2u) % g.y) % g.y;
  float ltf = float(lt) + uTf;
  int s = int(lt / ${SLOT}u), n = int((g.y + ${SLOT - 1}u) / ${SLOT}u);
  for (int k = 0; k <= ${Math.ceil(FADE / SLOT)}; k++) {
    int sk = s - k;
    float wrap = 0.0;
    if (sk < 0) { sk += n; wrap = float(g.y); }
    uint idx = g.x + uint(sk);
    uint v = texelFetch(uSlots, ivec2(int(idx % 4096u), int(idx / 4096u)), 0).r;
    if (v > 0u) { float a = ltf + wrap - float(uint(sk) * ${SLOT}u + (v & 127u) - 1u); if (a >= 0.0) return vec2(a, float(v >> 7)); }
  }
  return vec2(1e9, 0.0);
}
void main() {
  vec2 px = vec2(gl_FragCoord.x - 0.5, uRes.y - gl_FragCoord.y - 0.5);
  float by = float(uRows) / uRes.y, bx = float(uCols) / uRes.x;
  uint j = uint(int(px.y) * int(uRes.x) + int(px.x));
  int y = int(px.y * by) + (by > 1.0 ? int(mix32(j, 3u) % uint(by)) : 0);
  int x = int(px.x * bx) + (bx > 1.0 ? int(mix32(j, 4u) % uint(bx)) : 0);
  vec2 a = age(uint(min(y, uRows - 1) * uCols + min(x, uCols - 1)));
  float f = a.x < ${FADE}.0 ? pow(1.0 - a.x / ${FADE}.0, 1.5) : 0.0;
  color = vec4(mix(uIdle, a.y > 0.5 ? uErr : uOk, f) / 255.0, 1.0);
}`;
function initGL(cv) {
  const gl = cv.getContext('webgl2');
  if (!gl) return null;
  const shader = (type, src) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, '#version 300 es\nin vec2 p;\nvoid main() { gl_Position = vec4(p, 0.0, 1.0); }'));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, CROWD_FS));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const texture = (unit, ifmt, fmt, type, w, h, data) => {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, type, data);
  };
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  texture(0, gl.R8UI, gl.RED_INTEGER, gl.UNSIGNED_BYTE, 4096, SC.slots.length / 4096, SC.slots);
  const gh = Math.ceil(SC.pool / 128), table = new Uint32Array(128 * gh * 2);
  SC.rank.forEach((p, k) => { table[2 * k] = SC.slotOff[p]; table[2 * k + 1] = SC.games[p].len; });
  texture(1, gl.RG32UI, gl.RG_INTEGER, gl.UNSIGNED_INT, 128, gh, table);
  const u = {};
  ['uSlots', 'uGames', 'uT', 'uPool', 'uTf', 'uRows', 'uCols', 'uRes', 'uIdle', 'uOk', 'uErr'].forEach((k) => { u[k] = gl.getUniformLocation(prog, k); });
  gl.uniform1i(u.uSlots, 0); gl.uniform1i(u.uGames, 1);
  gl.uniform1ui(u.uPool, SC.pool);
  return { gl, u, cv };
}
function drawCrowd() {
  const cv = document.getElementById('gridgl');
  if (!SC.gl || SC.gl.cv !== cv) SC.gl = initGL(cv);   // the canvas is recreated when the view re-renders
  if (!SC.gl) return;
  const W = Math.round(cv.clientWidth * devicePixelRatio), H = Math.round(W / 2), { gl, u } = SC.gl;
  if (cv.width !== W) { cv.width = W; cv.height = H; }
  gl.viewport(0, 0, W, H);
  gl.uniform1ui(u.uT, Math.floor(SC.t) >>> 0); gl.uniform1f(u.uTf, SC.t % 1);
  const { idle, vivid } = pal();
  gl.uniform3fv(u.uIdle, idle); gl.uniform3fv(u.uOk, vivid[1]); gl.uniform3fv(u.uErr, vivid[2]);
  gl.uniform1i(u.uRows, S.r); gl.uniform1i(u.uCols, 2 * S.r); gl.uniform2f(u.uRes, W, H);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ============================== TOOLBAR ============================== */
const DEFAULTS = { add: [47, 38], sub: [38, 47], mul: [7, 46], div: [7, 46] };
function renderToolbar() {
  const tabs = [['live', 'Live session'], ['problem', 'By problem'], ['scale', 'All games']].map(([m, l]) =>
    `<button class="tab${S.mode === m ? ' on' : ''}" role="tab" aria-selected="${S.mode === m}" data-act="tab" data-v="${m}">${l}</button>`).join('');
  let right;
  if (S.mode === 'live') {
    right = sessions().map((s, i) =>
      `<button class="chip${S.session === i ? ' on' : ''}" data-act="session" data-v="${i}">${s.label}</button>`).join('') +
      `<button class="chip" data-act="pause" aria-label="${S.paused ? 'Play' : 'Pause'}">${S.paused
        ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>'
        : '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>'}</button>`;
  } else if (S.mode === 'scale') {
    right = SC ? `<span class="label" id="scaleN">${scaleNote()}</span>
      <input class="slider" type="range" min="0" max="1000" step="100" value="${sliderFromR(S.r)}" aria-label="Number of games">` : '';
  } else {
    right = '<span class="label">Operator</span>' + Object.keys(OPS).map((op) =>
      `<button class="chip op${S.prob && S.prob.op === op ? ' on' : ''}" data-act="op" data-v="${op}" aria-label="${OPS[op].name}">${OPS[op].sym}</button>`).join('');
  }
  document.getElementById('toolbar').innerHTML =
    `<div class="tabs" role="tablist" aria-label="View">${tabs}</div><div class="ctrls">${right}</div>`;
}

function renderAll() {
  renderToolbar();
  if (S.mode === 'live') renderLive(performance.now());
  else if (S.mode === 'scale') { loadScale(); renderScale(); }
  else renderProblem();
}

/* ============================== EVENTS ============================== */
document.querySelector('.box').addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v, i = Number(el.dataset.i);
  if (act === 'tab') {
    S.mode = v;
    if (v === 'problem' && !S.prob) setProblem('add', 47, 38, null);
  } else if (act === 'session') { S.session = Number(v); S.t = 0; }
  else if (act === 'pause') S.paused = !S.paused;
  else if (act === 'bar') {
    const b = liveBars[i];
    S.mode = 'problem';
    setProblem(b.x.op, b.x.R, b.x.C, b.partial ? null : b.x.rt);
  } else if (act === 'cell') {
    const v2 = heatFor(S.prob.op).vals[i];
    setProblem(S.prob.op, v2.rc, v2.cc, null);
  } else if (act === 'op') setProblem(v, DEFAULTS[v][0], DEFAULTS[v][1], null);
  renderAll();
});
document.getElementById('toolbar').addEventListener('input', (e) => {
  if (!e.target.classList.contains('slider')) return;
  S.r = rFromSlider(Number(e.target.value));
  SC.answers = 0;
  document.getElementById('scaleN').innerHTML = scaleNote();
});
document.getElementById('citeBtn').addEventListener('click', (e) => {
  const c = document.getElementById('cite');
  c.hidden = !c.hidden;
  e.currentTarget.setAttribute('aria-expanded', String(!c.hidden));
});

document.getElementById('themeBtn').addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  localStorage.setItem('theme', t);
});

/* ============================== LOOP ============================== */
let last = performance.now();
function frame(now) {
  const dt = Math.max(0, now - last); last = now;   // first rAF timestamp can precede page start
  if (S.mode === 'live' && !S.paused) { S.t += dt; renderLive(now); }
  else if (S.mode === 'scale') drawScale(dt);
  requestAnimationFrame(frame);
}
renderAll();
requestAnimationFrame(frame);
</script>
</body>
</html>
